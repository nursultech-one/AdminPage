<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI Platform · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --ink:#17241D; --ink-soft:#4C5A52;
  --line:#DDE3DC; --forest:#1F4B3E; --forest-dark:#132F27; --gold:#B4842A;
  --gold-soft:#F4E8D2; --red:#B5432F;
  --r:10px; --shadow:0 1px 2px rgba(20,30,24,.06),0 6px 20px rgba(20,30,24,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101613; --surface:#161E19; --ink:#EAF0EA; --ink-soft:#9AABA1;
    --line:#28352E; --forest:#4C9878; --forest-dark:#8FD1AE; --gold:#D8A75B;
    --gold-soft:#2A2416;
  }
}
:root[data-theme="dark"]{
  --bg:#101613; --surface:#161E19; --ink:#EAF0EA; --ink-soft:#9AABA1;
  --line:#28352E; --forest:#4C9878; --forest-dark:#8FD1AE; --gold:#D8A75B;
  --gold-soft:#2A2416;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,Segoe UI,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
.serif{font-family:"Source Serif 4",Georgia,serif;}
header.top{
  position:sticky;top:0;z-index:20;background:var(--forest-dark);color:#F4F6F2;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 20px 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:var(--shadow);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--gold);color:var(--forest-dark);
  display:flex;align-items:center;justify-content:center;font-family:"Source Serif 4",serif;font-weight:600;font-size:16px;flex:none;}
.brand small{display:block;font-weight:500;font-size:11.5px;color:#C9D6CC;letter-spacing:.3px;}
.crumbs{font-size:13px;color:#C9D6CC;}
.crumbs button{background:none;border:none;color:#F4F6F2;font:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;}
main{max-width:1080px;margin:0 auto;padding:26px 20px 64px;}
.hero{margin-bottom:22px;}
.hero h1{font-family:"Source Serif 4",serif;font-weight:600;font-size:clamp(26px,4vw,34px);margin:0 0 6px;}
.hero p{color:var(--ink-soft);margin:0;max-width:62ch;line-height:1.55;font-size:15px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 20px;}
.search{
  flex:1 1 260px;position:relative;
}
.search input{
  width:100%;padding:11px 14px 11px 38px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:14px;
}
.search input:focus{outline:2px solid var(--forest);outline-offset:1px;}
.search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft);font-size:16px;}
.stat-pill{
  display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:999px;padding:9px 16px;font-size:13px;color:var(--ink-soft);white-space:nowrap;
}
.stat-pill b{color:var(--ink);font-size:14px;}
#bolims{display:flex;flex-direction:column;gap:12px;}
.bolim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);}
.bolim > .head{
  display:flex;align-items:center;gap:12px;padding:15px 18px;cursor:pointer;user-select:none;
  background:transparent;border:none;width:100%;text-align:left;font:inherit;color:inherit;
}
.bolim > .head .num{
  font-family:"Source Serif 4",serif;font-size:13px;color:var(--gold);border:1px solid var(--gold);
  border-radius:6px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none;
}
.bolim > .head .name{font-weight:700;font-size:15.5px;flex:1;}
.bolim > .head .count{font-size:12.5px;color:var(--ink-soft);background:var(--gold-soft);padding:4px 10px;border-radius:999px;flex:none;}
.bolim > .head .chev{transition:transform .18s ease;color:var(--ink-soft);flex:none;}
.bolim.open > .head .chev{transform:rotate(90deg);}
.bolim .kpis{display:none;border-top:1px solid var(--line);}
.bolim.open .kpis{display:block;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{
  text-align:left;font-weight:600;color:var(--ink-soft);font-size:11.5px;
  padding:9px 18px;border-bottom:1px solid var(--line);letter-spacing:.2px;
}
td{padding:11px 18px;border-bottom:1px solid var(--line);vertical-align:top;}
tr:last-child td{border-bottom:none;}
.code{
  font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;
}
.kname{max-width:520px;line-height:1.45;}
.postag{font-size:11.5px;color:var(--ink-soft);}
.tw{white-space:nowrap;}
.btn{
  border:1px solid var(--forest);background:var(--forest);color:#fff;border-radius:8px;
  padding:7px 13px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;
}
.btn:hover{background:var(--forest-dark);border-color:var(--forest-dark);}
.btn.ghost{background:transparent;color:var(--forest);}
:root[data-theme="dark"] .btn.ghost, body.dark .btn.ghost{color:var(--forest-dark);}
.btn.small{padding:5px 10px;font-size:12px;}
.btn.danger{background:transparent;border-color:var(--line);color:var(--red);}
.empty{padding:28px 18px;color:var(--ink-soft);font-size:13.5px;text-align:center;}

/* page 2 */
.back{
  display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--forest);
  font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;padding:0;margin-bottom:16px;
}
:root[data-theme="dark"] .back, body.dark .back{color:var(--forest-dark);}
.kpi-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-bottom:20px;}
.kpi-card .tag{font-size:12px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
.kpi-card h2{font-family:"Source Serif 4",serif;font-weight:600;font-size:22px;margin:0 0 10px;line-height:1.3;}
.meta-row{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-soft);}
.meta-row span b{color:var(--ink);}
.section-title{font-weight:700;font-size:14.5px;margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;}
.section-title small{font-weight:500;color:var(--ink-soft);}
.assign-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}
.assign-row{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.assign-row:last-child{border-bottom:none;}
.pos-id{
  font-family:"Source Serif 4",serif;font-size:12px;background:var(--bg);border:1px solid var(--line);
  border-radius:6px;padding:3px 8px;color:var(--ink-soft);
}
.pos-name{font-weight:600;font-size:13.5px;flex:1 1 180px;min-width:140px;}
.inline-form{display:none;flex-basis:100%;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.assign-row.editing .inline-form{display:flex;align-items:center;}
.inline-form input[type=text]{
  flex:1 1 200px;padding:8px 11px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;
}
.inline-form select{padding:8px 11px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;}
.assigned-wrap{overflow-x:auto;}
footer.note{margin-top:30px;font-size:12px;color:var(--ink-soft);line-height:1.6;border-top:1px solid var(--line);padding-top:14px;}
@media(max-width:640px){
  th:nth-child(3), td:nth-child(3){display:none;}
  .kname{max-width:220px;}
}

.pos-list{list-style:none;margin:0;padding:0;}
.pos-list li{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);}
.pos-list li:last-child{border-bottom:none;}
.subnote{color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:-4px 0 12px;max-width:70ch;}
.picker{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;}
.picker .prow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.picker input[type=text]{
  flex:1 1 260px;padding:10px 13px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;
}
.picker select{padding:10px 13px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;}
.results{margin-top:10px;max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;display:none;}
.results.show{display:block;}
.result-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;}
.result-row:last-child{border-bottom:none;}
.result-row:hover{background:var(--bg);}
.result-row.picked{background:var(--gold-soft);}
.result-row .rname{font-weight:600;font-size:13.5px;flex:1 1 auto;min-width:140px;}
.result-row .rmeta{font-size:11.5px;color:var(--ink-soft);text-align:right;}
.picked-chip{
  display:none;align-items:center;gap:10px;margin-top:12px;padding:10px 13px;background:var(--gold-soft);
  border-radius:8px;font-size:13.5px;
}
.picked-chip.show{display:flex;}
.picked-chip b{flex:1;}
.picked-chip .clear{background:none;border:none;color:var(--red);font:inherit;font-size:12px;cursor:pointer;}
.picker .actions{margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.hint{font-size:12px;color:var(--ink-soft);padding:8px 12px;}

.modal-back{position:fixed;inset:0;background:rgba(10,18,14,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);}
.modal-back.show{display:flex;}
.modal{background:var(--surface);color:var(--ink);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(1180px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;}
.modal-head{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);}
.modal-head h3{margin:0;font-family:"Source Serif 4",serif;font-size:18px;flex:1;line-height:1.35;}
.modal-head small{display:block;font-family:"Manrope",sans-serif;font-weight:500;font-size:12.5px;color:var(--ink-soft);margin-top:3px;}
.xbtn{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;flex:none;}
.modal-tools{padding:10px 20px;border-bottom:1px solid var(--line);}
.modal-tools input{width:100%;max-width:380px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;}
.modal-body{overflow:auto;}
.modal-body table{min-width:1000px;font-size:12.5px;}
.modal-body th{position:sticky;top:0;background:var(--surface);z-index:1;padding:9px 12px;white-space:nowrap;}
.modal-body td{padding:8px 12px;}
.people-btn{display:inline-flex;align-items:center;gap:8px;}
.note-small{font-size:12px;color:var(--ink-soft);margin-top:18px;line-height:1.6;}

.filter-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.filter-row select{padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;}
.filter-row .fcount{font-size:12px;color:var(--ink-soft);margin-left:auto;}
.pos-result{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;}
.pos-result:last-child{border-bottom:none;}
.pos-result:hover{background:var(--bg);}
.pos-result .pid{font-family:"Source Serif 4",serif;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;flex:none;}
.pos-result .plav{flex:1;font-size:13px;font-weight:600;}
.pos-result .pcnt{font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
.modal.wide{width:min(1180px,100%);}
.modal-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;}
.modal-foot .fcount{font-size:13px;color:var(--ink-soft);}
.chkrow input[type=checkbox]{width:16px;height:16px;accent-color:var(--forest);}
.badge-special{background:var(--gold);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 9px;text-transform:uppercase;letter-spacing:.3px;}
.hrnote{background:var(--gold-soft);border-radius:8px;padding:10px 14px;font-size:13px;color:#7A5A17;margin-bottom:14px;}
:root[data-theme="dark"] .hrnote{color:var(--gold);}

.group-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.group-row:last-child{border-bottom:none;}
.group-row .gname{font-weight:700;font-size:13.5px;flex:1 1 220px;}
.group-row .gsub{font-size:11.5px;color:var(--ink-soft);}
.pos-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;padding:10px 18px;font-size:13px;font-weight:600;color:var(--forest);user-select:none;}
:root[data-theme="dark"] .pos-toggle{color:var(--forest-dark);}
.pos-toggle .arrow{transition:transform .18s ease;}
.pos-toggle.open .arrow{transform:rotate(180deg);}
.pos-collapse{display:none;border-top:1px solid var(--line);}
.pos-collapse.open{display:block;}
.bulkbar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;}
.bulkbar select{padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;}
.member-row td select{padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:12px;}
.modal-body table.wide2{min-width:1300px;}
.ref-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px;}
.ref-table th{background:var(--bg);text-align:left;padding:9px 12px;border:1px solid var(--line);font-size:11.5px;color:var(--ink-soft);}
.ref-table td{padding:9px 12px;border:1px solid var(--line);vertical-align:top;line-height:1.5;}
.ref-table td.n{text-align:center;font-weight:700;}
</style>

</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">K</span><div><div>KPI Platform</div><small>Admin panel</small></div></div>
  <div class="crumbs" id="crumbs">Бўлимлар</div>
</header>

<script>
let DATA=[],EMP={},POS=[],DEPS=[],HRPOOL=[];
try{DATA=JSON.parse(document.getElementById('data').textContent);}catch(e){}
try{EMP=JSON.parse(document.getElementById('emp').textContent);}catch(e){}
try{POS=JSON.parse(document.getElementById('pos').textContent);}catch(e){}
try{DEPS=JSON.parse(document.getElementById('deps').textContent);}catch(e){}
try{HRPOOL=JSON.parse(document.getElementById('hrpool').textContent);}catch(e){}
const app=document.getElementById('app'),crumbs=document.getElementById('crumbs');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PERIODS=["To'liq","10 kun"];
/* store: { [code]: { groups:[{kid,lavozim,members:[{tab,name,dep,lavozim,inps,branch,local,listNomi,bolim,checked,period}]}], hr:[{tab,name,lavozim,dep,period}] } } */
let store={};
try{store=JSON.parse(localStorage.getItem('kpi_assign_v5')||'{}');}catch(e){}
function saveStore(){try{localStorage.setItem('kpi_assign_v5',JSON.stringify(store));}catch(e){}}
function ratedRows(k){const r=[];k.positions.forEach(p=>(EMP[p.id]||[]).forEach(x=>r.push(x)));return r;}
DATA.forEach(k=>{k.n=ratedRows(k).length;});
let curK=null,curRows=[],hrPicked=null,activeGroup=null;

function route(){
  document.body.style.overflow='';
  const h=location.hash;
  if(h.startsWith('#kpi/'))renderKpi(parseInt(h.split('/')[1],10));else renderHome();
}
window.addEventListener('hashchange',route);

function ensureRec(code){ return store[code]=store[code]||{groups:[]}; }
function countAssigned(code){
  const rec=store[code]; if(!rec) return 0;
  let n=0;
  (rec.groups||[]).forEach(g=>n+=g.members.filter(m=>m.checked).length);
  return n;
}

/* ---------- PAGE 1 ---------- */
function renderHome(){
  crumbs.textContent='KPI кўрсаткичлари';
  app.innerHTML=`<div class="hero"><h1 class="serif">KPI кўрсаткичлари</h1>
  <p>Ходимлар томонидан баҳоланадиган ${DATA.length} та KPI кўрсаткичи. Ҳар бир кўрсаткич учун баҳоловчи тайинлаш учун "Tayinlash" тугмасини босинг.</p></div>
  <div class="toolbar"><div class="search"><input id="q" placeholder="Кўрсаткич номи ёки коди бўйича қидириш..."></div>
  <div class="stat-pill"><b>${DATA.length}</b> кўрсаткич</div></div>
  <div class="bolim open"><div class="kpis" style="display:block;border-top:none"><table>
   <thead><tr><th>#</th><th>KPI кўрсаткичлари</th><th>Кўрсаткич коди</th><th>Ходимлар</th><th></th></tr></thead>
   <tbody id="rows"></tbody></table></div></div>`;
  fillRows('');
  document.getElementById('q').addEventListener('input',e=>fillRows(e.target.value.trim().toLowerCase()));
}
function fillRows(q){
  const body=document.getElementById('rows');
  const list=DATA.map((k,i)=>({k,i})).filter(({k})=>!q||k.name.toLowerCase().includes(q)||k.code.toLowerCase().includes(q));
  body.innerHTML=list.length?list.map(({k,i})=>{
    const a=countAssigned(k.code);
    return `<tr><td class="tw postag">${i+1}</td>
    <td class="kname">${esc(k.name)}${k.special?' <span class="badge-special">Тўғрилловчи</span>':''}</td>
    <td><span class="code">${esc(k.code)}</span></td>
    <td class="tw postag">${k.n} ходим${a?' · '+a+' баҳоловчи':''}</td>
    <td class="tw"><button class="btn small" onclick="location.hash='#kpi/${i}'">Tayinlash</button></td></tr>`;
  }).join(''):'<tr><td colspan="5" class="empty">Ҳеч нарса топилмади</td></tr>';
}

/* ---------- PAGE 2 ---------- */
function renderKpi(i){
  const k=DATA[i];if(!k){location.hash='';return;}
  curK=k;curRows=ratedRows(k);
  crumbs.innerHTML=`<button onclick="location.hash=''">KPI кўрсаткичлари</button> / ${esc(k.code)}`;
  const rec=ensureRec(k.code);
  const big=k.positions.length>12;

  app.innerHTML=`
  <button class="back" onclick="location.hash=''">← Кўрсаткичлар рўйхатига қайтиш</button>
  <div class="kpi-card"><div class="tag">KPI кўрсаткичи${k.special?' · Тўғрилловчи':''}</div><h2 class="serif">${esc(k.name)}</h2>
   <div class="meta-row"><span>Код: <b>${esc(k.code)}</b></span><span>Лавозимлар: <b>${k.positions.length}</b></span>
   <span>Баҳоланадиган ходимлар: <b>${k.n}</b></span><span>Баҳоловчилар: <b id="asgCountTop">${countAssigned(k.code)}</b></span></div></div>

  <div class="section-title">Ushbu KPI ko'rsatkichi bilan baholanadigan lavozimlar
    <button class="btn ghost small people-btn" onclick="openPeople()">👥 Baholanadigan xodimlar ro'yxati (${k.n})</button></div>
  ${big?`
    <div class="assign-panel"><div class="pos-toggle" id="posToggleBtn" onclick="togglePos()"><span class="arrow">▾</span> Ушбу кўрсаткич бўйича ${k.n} та ходим баҳоланади — барча лавозим (KPI ID) ларини кўриш учун босинг</div>
    <div class="pos-collapse" id="posCollapse"><ul class="pos-list">${k.positions.map(p=>`<li><span class="pos-id">${esc(p.id)}</span><span class="pos-name">${esc(p.lavozim)}</span><span class="postag">${(EMP[p.id]||[]).length} ходим</span></li>`).join('')}</ul></div></div>`
  :`<p class="subnote">Quyidagi lavozimlar shu KPI ko'rsatkichi (${esc(k.code)}) bo'yicha baholanadi.</p>
    <div class="assign-panel"><ul class="pos-list">${k.positions.map(p=>`<li><span class="pos-id">${esc(p.id)}</span><span class="pos-name">${esc(p.lavozim)}</span><span class="postag">${(EMP[p.id]||[]).length} ходим</span></li>`).join('')}</ul></div>`}

  ${renderPosPicker(k)}

  <div class="section-title">Тайинланган баҳоловчилар <small id="asgCount">${countAssigned(k.code)} та баҳоловчи</small></div>
  <div class="assign-panel" id="groupsWrap"></div>

  <div class="modal-back" id="pmodal" onclick="if(event.target===this)closePeople()"><div class="modal wide" role="dialog" aria-modal="true">
   <div class="modal-head"><h3>Ushbu KPI bo'yicha baholanadigan xodimlar<small id="pmSub"></small></h3><button class="xbtn" onclick="closePeople()">×</button></div>
   <div class="modal-tools"><input type="text" id="pmFilter" placeholder="Ism, tabel, KPI_ID yoki lavozim bo'yicha filtr...">
     <div class="filter-row"><select id="pmDep"><option value="">Barcha filiallar</option>${DEPS.map(d=>`<option>${esc(d)}</option>`).join('')}</select><span class="fcount" id="pmCount"></span></div></div>
   <div class="modal-body"><table><thead><tr><th>#</th><th>Dep.name</th><th>INPS</th><th>BRANCH_ID</th><th>Local</th><th>KPI_List_nomi</th><th>KPI_ID</th><th>Ф. И. Ш.</th><th>Таб.</th><th>Bolim</th><th>Лавозими</th></tr></thead><tbody id="pmBody"></tbody></table></div>
  </div></div>

  <div class="modal-back" id="gmodal" onclick="if(event.target===this)closeGroupModal()"><div class="modal wide" role="dialog" aria-modal="true">
   <div class="modal-head"><h3 id="gmTitle"></h3><button class="xbtn" onclick="closeGroupModal()">×</button></div>
   <div class="modal-tools"><input type="text" id="gmFilter" placeholder="Ф.И.Ш., табель ёки филиал бўйича қидириш...">
     <div class="filter-row"><select id="gmDep"><option value="">Barcha filiallar</option>${DEPS.map(d=>`<option>${esc(d)}</option>`).join('')}</select><span class="fcount" id="gmCount"></span></div></div>
   <div class="bulkbar">Барчасига davr: <select id="gmBulkPeriod">${PERIODS.map(p=>`<option>${p}</option>`).join('')}</select>
     <button class="btn small" onclick="applyBulkPeriod()">Barchasiga qo'llash</button>
     <button class="btn small ghost" onclick="toggleAllChecked(true)">Barchasini belgilash</button>
     <button class="btn small ghost" onclick="toggleAllChecked(false)">Барчасидан белгини олиш</button></div>
   <div class="modal-body"><table class="wide2"><thead><tr><th></th><th>Ф. И. Ш.</th><th>Таб.</th><th>Period</th><th>Dep.name</th><th>INPS</th><th>BRANCH_ID</th><th>Local</th><th>KPI_List_nomi</th><th>KPI_ID</th><th>Bolim</th><th>Лавозими</th></tr></thead><tbody id="gmBody"></tbody></table></div>
  </div></div>

  <footer class="note">Прототип: тайинлашлар фақат ушбу браузерда локал сақланади.</footer>`;

  document.getElementById('pmFilter').addEventListener('input',()=>fillPeople());
  document.getElementById('pmDep').addEventListener('change',()=>fillPeople());
  document.getElementById('psearch').addEventListener('input',onPosSearch);
  document.getElementById('gmFilter').addEventListener('input',()=>fillGroupModal());
  document.getElementById('gmDep').addEventListener('change',()=>fillGroupModal());
  renderGroups();
}

function renderPosPicker(k){
  const hrOnly = k.special==='tugrilovchi';
  return `<div class="section-title">Baholovchi lavozimini tanlash</div>
  ${hrOnly?`<div class="hrnote">⚠ Тўғрилловчи кўрсаткич бўйича баҳоловчи фақат <b>Кадр (HR)</b> бўлими лавозимлари орасидан тайинланади.</div>`:''}
  <p class="subnote">KPI ID (лавозим коди) бўйича қидиринг${hrOnly?' (фақат Кадр бўлими лавозимлари кўринади)':' — масалан <b>upr</b>, <b>hr_mudiri</b>'}. Натижани танласангиз, шу лавозимдаги барча ходимлар автоматик баҳоловчи сифатида тайинланади (кейин уларни рўйхатда алоҳида-алоҳида белгидан олиб ташлашингиз ёки даврини ўзгартиришингиз мумкин).</p>
  <div class="picker"><div class="prow"><input type="text" id="psearch" placeholder="KPI ID yoki lavozim bo'yicha qidirish..."></div>
   <div class="results" id="presults"></div>
   <div class="hint" id="phint">Qidiruvni boshlash uchun kamida 1 ta belgi kiriting.</div></div>`;
}
function togglePos(){
  document.getElementById('posToggleBtn').classList.toggle('open');
  document.getElementById('posCollapse').classList.toggle('open');
}
window.togglePos=togglePos;

/* ---- position (KPI_ID) search -> immediate group assignment (no popup) ---- */
function onPosSearch(e){
  const q=e.target.value.trim().toLowerCase(),box=document.getElementById('presults'),hint=document.getElementById('phint');
  if(q.length<1){box.classList.remove('show');box.innerHTML='';hint.style.display='block';return;}
  hint.style.display='none';
  const pool=(curK.special==='tugrilovchi')?POS.filter(p=>p.bolim==='Кадр'):POS;
  const m=pool.filter(p=>p.id.toLowerCase().includes(q)||p.lavozim.toLowerCase().includes(q)).slice(0,30);
  box.innerHTML=m.length?m.map((p,i)=>`<div class="pos-result" onclick="assignGroup(${i})"><span class="pid">${esc(p.id)}</span><span class="plav">${esc(p.lavozim)}</span><span class="pcnt">${p.cnt} ходим</span></div>`).join(''):'<div class="hint">Мос лавозим топилмади</div>';
  box.classList.add('show');box._m=m;
}
function assignGroup(i){
  const box=document.getElementById('presults'),chosen=box._m[i];
  const rec=ensureRec(curK.code);
  if(rec.groups.some(g=>g.kid===chosen.id)){
    document.getElementById('psearch').value='';box.classList.remove('show');document.getElementById('phint').style.display='block';
    return;
  }
  const members=(EMP[chosen.id]||[]).map(r=>({tab:r[7],name:r[6],dep:r[0],inps:r[1],branch:r[2],local:r[3],listNomi:r[4],lavozim:r[9],bolim:r[8],checked:true,period:"To'liq"}));
  rec.groups.push({kid:chosen.id,lavozim:chosen.lavozim,members});
  saveStore();
  document.getElementById('psearch').value='';box.classList.remove('show');document.getElementById('phint').style.display='block';
  renderGroups();
}
window.assignGroup=assignGroup;

/* ---- groups table (page 2 "assigned" area) ---- */
function renderGroups(){
  const rec=ensureRec(curK.code);
  const wrap=document.getElementById('groupsWrap');
  document.getElementById('asgCount').textContent=countAssigned(curK.code)+' та баҳоловчи';
  document.getElementById('asgCountTop').textContent=countAssigned(curK.code);
  const rows=[];
  rec.groups.forEach((g,gi)=>{
    const checked=g.members.filter(m=>m.checked).length;
    rows.push(`<div class="group-row"><span class="pos-id">${esc(g.kid)}</span>
      <span class="gname">${esc(g.lavozim)}<div class="gsub">${checked} / ${g.members.length} ходим танланган</div></span>
      <button class="btn ghost small" onclick="openGroupModal(${gi})">Ро'йхатни кўриш / таҳрирлаш</button>
      <button class="btn danger small" onclick="removeGroup(${gi})">O'chirish</button></div>`);
  });
  wrap.innerHTML = rows.length?rows.join(''):'<div class="empty">Ҳали баҳоловчи тайинланмаган</div>';
}
function removeGroup(gi){ensureRec(curK.code).groups.splice(gi,1);saveStore();renderGroups();}
function removeHr(hi){ensureRec(curK.code).hr.splice(hi,1);saveStore();renderGroups();}
Object.assign(window,{removeGroup,removeHr});

/* ---- group editing popup: tick/untick + per-person period + bulk period ---- */
function openGroupModal(gi){
  activeGroup=gi;
  const g=ensureRec(curK.code).groups[gi];
  document.getElementById('gmTitle').innerHTML=`<span class="pos-id">${esc(g.kid)}</span> ${esc(g.lavozim)} <small style="font-family:'Manrope';font-weight:500;color:var(--ink-soft);display:block;margin-top:3px">${g.members.length} ходим</small>`;
  document.getElementById('gmFilter').value='';document.getElementById('gmDep').value='';
  fillGroupModal();
  document.getElementById('gmodal').classList.add('show');document.body.style.overflow='hidden';
}
function closeGroupModal(){document.getElementById('gmodal').classList.remove('show');document.body.style.overflow='';renderGroups();}
function fillGroupModal(){
  const g=ensureRec(curK.code).groups[activeGroup];
  const q=document.getElementById('gmFilter').value.trim().toLowerCase(),dep=document.getElementById('gmDep').value;
  const idxs=g.members.map((m,i)=>i).filter(i=>{
    const m=g.members[i];
    if(dep&&m.dep!==dep) return false;
    if(q&&!(m.name+' '+m.tab+' '+m.dep).toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('gmCount').textContent=idxs.length+' / '+g.members.length+' ходим кўрсатилмоқда';
  document.getElementById('gmBody').innerHTML=idxs.length?idxs.map(i=>{
    const m=g.members[i];
    return `<tr><td class="chkrow"><input type="checkbox" ${m.checked?'checked':''} onchange="onMemberCheck(${i},this)"></td>
    <td><b>${esc(m.name)}</b></td><td class="tw">${esc(m.tab)}</td>
    <td><select onchange="onMemberPeriod(${i},this)">${PERIODS.map(p=>`<option ${p===m.period?'selected':''}>${p}</option>`).join('')}</select></td>
    <td class="tw">${esc(m.dep)}</td><td class="tw">${esc(m.inps)}</td><td class="tw">${esc(m.branch)}</td><td class="tw">${esc(m.local)}</td>
    <td>${esc(m.listNomi)}</td><td><span class="code">${esc(g.kid)}</span></td><td>${esc(m.bolim)}</td><td>${esc(m.lavozim)}</td></tr>`;
  }).join(''):'<tr><td colspan="12" class="empty">Мос ходим топилмади</td></tr>';
}
function onMemberCheck(i,el){
  const g=ensureRec(curK.code).groups[activeGroup]; g.members[i].checked=el.checked; saveStore();
  document.getElementById('gmCount').textContent && fillGroupModal();
}
function onMemberPeriod(i,el){
  const g=ensureRec(curK.code).groups[activeGroup]; g.members[i].period=el.value; saveStore();
}
function applyBulkPeriod(){
  const g=ensureRec(curK.code).groups[activeGroup],p=document.getElementById('gmBulkPeriod').value;
  g.members.forEach(m=>m.period=p); saveStore(); fillGroupModal();
}
function toggleAllChecked(val){
  const g=ensureRec(curK.code).groups[activeGroup];
  g.members.forEach(m=>m.checked=val); saveStore(); fillGroupModal();
}
Object.assign(window,{openGroupModal,closeGroupModal,onMemberCheck,onMemberPeriod,applyBulkPeriod,toggleAllChecked});

/* ---- "baholanadigan xodimlar" popup ---- */
function fillPeople(){
  const q=(document.getElementById('pmFilter').value||'').trim().toLowerCase(),dep=document.getElementById('pmDep').value;
  const rows=curRows.filter(r=>(!dep||r[0]===dep)&&(!q||r.join(' ').toLowerCase().includes(q)));
  document.getElementById('pmSub').textContent=curK.code+' — '+curK.name+' · '+rows.length+'/'+curRows.length+' xodim';
  document.getElementById('pmCount').textContent=rows.length+' / '+curRows.length;
  document.getElementById('pmBody').innerHTML=rows.length?rows.map((r,i)=>'<tr><td>'+(i+1)+'</td>'+r.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="11" class="empty">Мос ходим топилмади</td></tr>';
}
function openPeople(){document.getElementById('pmFilter').value='';document.getElementById('pmDep').value='';fillPeople();document.getElementById('pmodal').classList.add('show');document.body.style.overflow='hidden';}
function closePeople(){const m=document.getElementById('pmodal');if(m)m.classList.remove('show');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePeople();closeGroupModal();}});
Object.assign(window,{openPeople,closePeople});

route();
</script>
</body>
</html>
